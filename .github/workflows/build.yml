name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable          # без жёсткой версии — актуальный шаблон Gradle/Kotlin
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files
        run: |
          rm -rf android
          flutter create --platforms=android --project-name sudoku --org com.example .
          rm -f test/widget_test.dart

      - name: Patch Android config
        run: |
          # Название приложения
          sed -i 's/android:label="sudoku"/android:label="Судоку"/' android/app/src/main/AndroidManifest.xml

          # Gradle-файл может быть .kts или .gradle — патчим тот, что есть
          APP_GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)
          echo "App gradle: $APP_GRADLE"

          # minSdk 23 вместо flutter.minSdkVersion
          sed -i -E 's/minSdk( =|) *flutter\.minSdkVersion/minSdk\1 23/' "$APP_GRADLE"
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' "$APP_GRADLE"

          # Отключаем lint-проверку при release-сборке
          if [[ "$APP_GRADLE" == *.kts ]]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> "$APP_GRADLE"
          else
            printf '\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> "$APP_GRADLE"
          fi

          # Память для Gradle
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

          grep -nE "minSdk|kotlin|com.android.application" "$APP_GRADLE" android/settings.gradle* || true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon/icon.svg -o assets/icon/icon.png
          rsvg-convert -w 1024 -h 1024 assets/icon/icon_foreground.svg -o assets/icon/icon_foreground.png
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
